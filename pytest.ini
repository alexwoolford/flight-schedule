; Section must be [pytest] in pytest.ini. The [tool:pytest] form is only honoured
; in setup.cfg — using it here silently disabled testpaths, addopts and the
; marker registrations below.
[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
python_classes = Test*
addopts =
    --verbose
    --tb=short
    --strict-markers
markers =
    integration: marks tests as integration tests (deselect with '-m "not integration"')
    slow: marks tests as slow (deselect with '-m "not slow"')
    unit: marks tests as unit tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
