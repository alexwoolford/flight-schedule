name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up Java (required for PySpark)
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Setup Conda
      uses: conda-incubator/setup-miniconda@v3
      with:
        environment-file: environment.yml
        activate-environment: flight-schedule
        auto-activate-base: false

    - name: Install dependencies
      shell: bash -l {0}
      run: |
        # Dependencies are already installed via environment.yml
        echo "Dependencies installed via conda environment.yml"
        # Verify key packages are available
        python -c "import pyspark; print(f'PySpark: {pyspark.__version__}')"
        python -c "import neo4j; print(f'Neo4j: {neo4j.__version__}')"

    - name: Code formatting check (black)
      shell: bash -l {0}
      run: |
        black --check --diff .

    - name: Import sorting check (isort)
      shell: bash -l {0}
      run: |
        isort --check-only --diff .

    - name: Linting (flake8)
      shell: bash -l {0}
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics

    - name: Type checking (mypy)
      shell: bash -l {0}
      run: |
        mypy --install-types --non-interactive .
      continue-on-error: true  # Allow to pass for now during migration

    - name: Security check (bandit)
      shell: bash -l {0}
      run: |
        bandit -r . -x tests/ -f json -o bandit-report.json
        bandit -r . -x tests/ -ll
      continue-on-error: true

    - name: Dependency vulnerability check (safety)
      shell: bash -l {0}
      run: |
        safety check --json --output safety-report.json
        safety check
      continue-on-error: true

    - name: Run unit tests with coverage
      shell: bash -l {0}
      run: |
        # Every DB-free test file in tests/, listed explicitly rather than by
        # directory: `pytest tests/` would pull in the files that need a loaded
        # graph, and conftest.py *skips* those rather than failing, so they would
        # report green here having asserted nothing. The integration-test job
        # below is where those run, against a real load.
        #
        # The six files after test_flight_search_service_unit.py (+113 tests, all
        # sub-second) were passing but ungated for no reason. Confirmed DB-free by
        # running them against a dead port: 113 passed pointing at 127.0.0.1:1.
        pytest tests/test_ci_unit.py \
               tests/test_flight_search_unit.py \
               tests/test_download_bts_unit.py \
               tests/test_load_bts_unit.py \
               tests/test_system_validation_unit.py \
               tests/test_flight_search_service_unit.py \
               tests/test_business_rules.py \
               tests/test_data_quality_checks.py \
               tests/test_data_transformations.py \
               tests/test_environment_scenarios.py \
               tests/test_error_scenarios.py \
               tests/test_performance_boundaries.py \
               tests/test_pipeline_integration.py \
               -v --cov=. --cov-report=xml --cov-report=term-missing

    - name: Run load-test framework tests (separate process — gevent)
      shell: bash -l {0}
      run: |
        # A SEPARATE pytest process, deliberately, and not merely for tidiness.
        # Importing this file imports locust, which monkey-patches threading via
        # gevent for the rest of the interpreter's life. FastAPI's TestClient
        # drives the app through an anyio blocking-portal *thread*, and once that
        # thread is a greenlet the two deadlock: the process parks in
        # gevent/hub.py and never returns.
        #
        # Reproduced: TestApiStatusMapping passes alone in 0.42s and hangs
        # forever after `import neo4j_flight_load_test` in the same process.
        # It would hang, not fail — burning the runner's full timeout instead of
        # reporting red — so this must not be folded back into the step above.
        # Appending the file there happened to pass only because pytest imports
        # in file order and locust came last; that is ordering luck, not safety.
        pytest tests/test_load_testing_framework.py -v \
               --cov=. --cov-append --cov-report=xml
      env:
        # Mock environment for tests that don't need real Neo4j
        NEO4J_URI: bolt://localhost:7687
        NEO4J_USERNAME: neo4j
        NEO4J_PASSWORD: test
        NEO4J_DATABASE: flights

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      if: always()
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  integration-test:
    # Loads one real BTS day into a throwaway Neo4j, builds the CONNECTS_TO
    # routing edges with the production loader, and runs the graph assertions
    # against the result. This is what makes the routing guarantees gate a
    # merge: the correctness claims in ROUTING_QUERY_REFERENCE.md (no overnight
    # inbound legs, sellable carrier pairs, real hub concentration) are checked
    # on every push rather than only when someone remembers to load locally.
    runs-on: ubuntu-latest
    needs: test
    # The whole sequence takes ~35s of real work locally; the rest is conda and
    # the Spark connector download. A cap well above that keeps a hung Neo4j or
    # a stalled Maven fetch from burning a full six hours of runner time.
    timeout-minutes: 30

    services:
      neo4j:
        # Pinned to the same major the loader is developed against. Do NOT
        # downgrade to 5.x: create_connects_to() uses the variable-scope
        # `CALL (r) { ... } IN TRANSACTIONS` form, which older parsers reject,
        # and the QPP assertions need 5.9+.
        image: neo4j:2026.05.0-community
        env:
          NEO4J_AUTH: neo4j/testpassword
          NEO4J_server_memory_heap_max__size: 2G
          NEO4J_server_memory_pagecache_size: 1G
        ports:
          - 7687:7687
          - 7474:7474
        # This healthcheck only proves HTTP is up, which happens before Bolt
        # will serve a session — the explicit wait step below is what the load
        # actually depends on.
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: testpassword
      # Community edition can only host one database, so this must be the
      # default `neo4j` — the old `NEO4J_dbms_default__database: flights`
      # setting on this job was both 4.x-era syntax and unachievable here.
      NEO4J_DATABASE: neo4j
      # The date held by tests/fixtures/bts_flights_2025_07_18.parquet.
      FIXTURE_DATE: "2025-07-18"
      # Deliberately NOT UTC. GitHub runners default to UTC, which is the one
      # zone where a timezone bug in the loader is invisible: correct and
      # offset-baked code paths agree there. Denver reproduces the exact +7h
      # signature of the fabricated README block removed in f20f20c, so if the
      # loader ever starts writing zoned timestamps, `flightdate` lands on
      # 2025-07-17 and the "Verify the graph is actually loaded" step below
      # fails on FIXTURE_DATE instead of the whole job passing on a shifted day.
      #
      # This is a backstop, not the primary gate: the two Spark keys that
      # prevent it each independently suffice (see create_spark_session), so
      # removing just one is invisible end-to-end and is caught by
      # test_timezone_semantics_are_pinned_not_inherited instead.
      TZ: America/Denver

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java (required for PySpark)
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Setup Conda
      uses: conda-incubator/setup-miniconda@v3
      with:
        environment-file: environment.yml
        activate-environment: flight-schedule
        auto-activate-base: false

    - name: Wait for Neo4j to accept authenticated Bolt connections
      shell: bash -l {0}
      run: |
        # NOT a curl on 7474, which is what this step used to be: the published
        # port answers HTTP at t=0 while Bolt needs ~5s more, so an HTTP 200 is
        # not a green light for the loader. See the module docstring.
        python tests/ci_wait_for_neo4j.py

    # The Neo4j Spark connector is resolved from Maven at runtime via
    # spark.jars.packages, so cache Ivy's download directory rather than
    # re-fetching the JAR and its transitive deps on every run.
    - name: Cache Spark connector JARs
      uses: actions/cache@v4
      with:
        path: ~/.ivy2
        key: ivy2-neo4j-connector-5.5.0-for-spark-3

    - name: Load one real BTS day
      shell: bash -l {0}
      run: |
        # A committed 21,495-row slice of real BTS On-Time Performance data for
        # 2025-07-18, carrying the full 110-column schema. Real records, not
        # generated ones (CLAUDE.md rule 1). Loaded by the production loader so
        # this also covers the loader itself, not just the queries.
        python load_bts_data.py \
          --single-file bts_flights_2025_07_18.parquet \
          --data-path tests/fixtures

    - name: Solve airport UTC offsets and write UTC timestamps
      shell: bash -l {0}
      run: |
        # Must run BEFORE --build-connections, which computes layovers from the
        # scheduled_*_utc properties this step creates. Recovers every airport's
        # UTC offset from the loaded block times alone -- no timezone database --
        # and asserts one connected component with zero conflicts, so a bad or
        # partial load fails here rather than producing plausible wrong times.
        python load_bts_data.py --solve-offsets "$FIXTURE_DATE"

    - name: Build CONNECTS_TO routing edges
      shell: bash -l {0}
      run: |
        python load_bts_data.py --build-connections "$FIXTURE_DATE"

    - name: Verify the graph is actually loaded
      shell: bash -l {0}
      run: |
        # Guards against a false green: the conftest fixtures skip cleanly when
        # Neo4j is unreachable or empty, which would otherwise let this job pass
        # having asserted nothing. Passing the date also checks that the two
        # steps above actually wrote the UTC properties, which the node counts
        # alone cannot see.
        python tests/ci_verify_loaded.py "$FIXTURE_DATE"

    - name: Run graph and routing assertions
      shell: bash -l {0}
      run: |
        # -p no:randomly is not in play; order is file order. All seven files
        # pass against a single real BTS day. Nothing is excluded any more:
        # test_performance.py and test_performance_baseline.py used to be, and
        # have been deleted rather than carried as known-failing — the first was
        # vacuous (6.9M schedules loaded, 0 carrying the date_of_operation it
        # queried, and every assertion `>= 0`), the second asserted wall-clock
        # thresholds that say nothing on a shared runner. test_query_plan.py
        # replaces the part worth gating.
        #
        # test_flight_search_integration.py covers flight_search.py and api.py
        # against real flights. Its acyclicity checks deliberately request
        # limit=3000: revisits rank below 1,038 on LGA->DFW, so a serving-sized
        # limit cannot see the defect they guard.
        pytest tests/test_graph_validation.py \
               tests/test_connection_logic.py \
               tests/test_integration_heavy.py \
               tests/test_documented_queries.py \
               tests/test_timezone_offsets.py \
               tests/test_flight_search_integration.py \
               tests/test_query_plan.py -v

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Build Docker image
      run: |
        docker build -t flight-search:${{ github.sha }} .
      if: always()  # Build even if tests fail, for debugging
